stages:
  - validate
  - test
  - build
  - publish
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

default:
  interruptible: true

repository:validate:
  stage: validate
  image:
    name: alpine/git:v2.49.1
    entrypoint: [""]
  script:
    - git diff --check
    - |
      required_files="
      backend/requirements.txt
      backend/pytest.ini
      backend/msap/settings/testing.py
      backend/Dockerfile
      .gitlab-ci.yml
      frontend/package.json
      frontend/package-lock.json
      frontend/Dockerfile
      compose.yaml
      helm/msap/Chart.yaml
      helm/msap/values.yaml
      helm/msap/values-local.yaml
      scripts/check-npm-audit.mjs
      docs/18_GitLab_CICD.md
      README.md
      "
      for required_file in $required_files; do
        if [ ! -f "$required_file" ]; then
          echo "Required project file is missing: $required_file" >&2
          exit 1
        fi
      done
    - |
      tracked_env_files="$(
        git ls-files |
          awk -F/ '
            {
              name = $NF
              if (name == ".env" || (name ~ /^\.env\./ && name !~ /\.example$/)) {
                print
              }
            }
          '
      )"
      if [ -n "$tracked_env_files" ]; then
        echo "Committed environment files are not allowed:" >&2
        printf '%s\n' "$tracked_env_files" >&2
        exit 1
      fi
    - |
      tracked_apks="$(git ls-files | awk 'tolower($0) ~ /\.apk$/ { print }')"
      if [ -n "$tracked_apks" ]; then
        echo "Committed APK files are not allowed:" >&2
        printf '%s\n' "$tracked_apks" >&2
        exit 1
      fi
    - |
      tracked_generated_paths="$(
        git ls-files |
          awk '
            /(^|\/)(__pycache__|node_modules)\// || /\.py[co]$/ {
              print
            }
          '
      )"
      if [ -n "$tracked_generated_paths" ]; then
        echo "Committed Python cache or node_modules paths are not allowed:" >&2
        printf '%s\n' "$tracked_generated_paths" >&2
        exit 1
      fi
    - |
      backend_version="$(awk -F'"' '/^MSAP_APPLICATION_VERSION =/ { print $4 }' backend/msap/settings/base.py)"
      compose_version="$(sed -n 's/.*MSAP_APPLICATION_VERSION:-\([^}]*\)}.*/\1/p' compose.yaml)"
      helm_values_version="$(awk '$1 == "applicationVersion:" { gsub(/"/, "", $2); print $2 }' helm/msap/values.yaml)"
      helm_app_version="$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }' helm/msap/Chart.yaml)"
      example_version="$(awk -F= '$1 == "MSAP_APPLICATION_VERSION" { print $2 }' backend/.env.example)"
      if [ -z "$backend_version" ]; then
        echo "Could not determine the backend application version." >&2
        exit 1
      fi
      for candidate_version in \
        "$compose_version" \
        "$helm_values_version" \
        "$helm_app_version" \
        "$example_version"; do
        if [ "$candidate_version" != "$backend_version" ]; then
          echo "Application version mismatch: expected $backend_version, found $candidate_version" >&2
          exit 1
        fi
      done
      echo "Application version sources agree on $backend_version."

.backend-python:
  image: python:3.12.13-slim-bookworm
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    DJANGO_SETTINGS_MODULE: msap.settings.testing
    ANALYZER_RULES_PATH: "$CI_PROJECT_DIR/rules"
  cache:
    key:
      files:
        - backend/requirements.txt
      prefix: backend-pip
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --disable-pip-version-check -r backend/requirements.txt

rules:validate:
  extends: .backend-python
  stage: validate
  script:
    - cd backend
    - python manage.py validate_rules
    - python manage.py makemigrations --check --dry-run

compose:validate:
  stage: validate
  image:
    name: docker:27.5.1-cli
    entrypoint: [""]
  script:
    - docker compose version
    - docker compose config

helm:validate:
  stage: validate
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  script:
    - mkdir -p artifacts/helm
    - helm lint --strict helm/msap
    - helm template msap helm/msap --namespace msap > artifacts/helm/default.yaml
    - helm template msap helm/msap --namespace msap -f helm/msap/values-local.yaml > artifacts/helm/local.yaml
  artifacts:
    expire_in: 3 days
    paths:
      - artifacts/helm/

backend:test:
  extends: .backend-python
  stage: test
  script:
    - mkdir -p artifacts/backend
    - cd backend
    - pytest -q --junitxml="$CI_PROJECT_DIR/artifacts/backend/pytest.xml"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: artifacts/backend/pytest.xml
    paths:
      - artifacts/backend/pytest.xml

frontend:build:
  stage: build
  image: node:22.23.1-alpine3.23
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - .cache/npm/
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm audit --json > "$CI_PROJECT_DIR/.cache/npm/audit.json" || true
    - node "$CI_PROJECT_DIR/scripts/check-npm-audit.mjs" "$CI_PROJECT_DIR/.cache/npm/audit.json"
    - npm run build
  artifacts:
    expire_in: 3 days
    paths:
      - frontend/dist/

.container-build:
  stage: publish
  interruptible: false
  image:
    name: docker:27.5.1-cli
    entrypoint: [""]
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      set -eu
      repository="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        primary_tag="$CI_COMMIT_TAG"
        publish=true
      elif [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        primary_tag="main-$CI_COMMIT_SHORT_SHA"
        publish=true
      else
        primary_tag="verify-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
        publish=false
      fi

      docker build \
        --pull \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --tag "$repository:$primary_tag" \
        --file "$DOCKERFILE" \
        "$BUILD_CONTEXT"

      if [ "$publish" = true ]; then
        printf '%s' "$CI_REGISTRY_PASSWORD" |
          docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$repository:$primary_tag"

        if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
          docker tag "$repository:$primary_tag" "$repository:latest"
          docker push "$repository:latest"
        fi

        docker logout "$CI_REGISTRY"
      else
        echo "Production image verified locally as $repository:$primary_tag; registry publication is disabled for this pipeline."
      fi

container:backend:
  extends: .container-build
  variables:
    IMAGE_NAME: backend
    DOCKERFILE: backend/Dockerfile
    BUILD_CONTEXT: .

container:frontend:
  extends: .container-build
  variables:
    IMAGE_NAME: frontend
    DOCKERFILE: frontend/Dockerfile
    BUILD_CONTEXT: frontend
