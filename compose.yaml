x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: msap.settings.development
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-compose-development-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  SESSION_COOKIE_NAME: msap_sessionid
  SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-28800}
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  AXES_FAILURE_LIMIT: ${AXES_FAILURE_LIMIT:-5}
  AXES_COOLOFF_MINUTES: ${AXES_COOLOFF_MINUTES:-15}
  MSAP_PASSWORD_MIN_LENGTH: ${MSAP_PASSWORD_MIN_LENGTH:-12}
  MSAP_TRUST_PROXY_HEADERS: "false"
  MSAP_STATUS_CACHE_SECONDS: ${MSAP_STATUS_CACHE_SECONDS:-5}
  MSAP_STATUS_TIMEOUT_SECONDS: ${MSAP_STATUS_TIMEOUT_SECONDS:-1.5}
  MSAP_APPLICATION_VERSION: ${MSAP_APPLICATION_VERSION:-0.2.0}
  MSAP_DYNAMIC_HOST_AGENT_ENABLED: ${MSAP_DYNAMIC_HOST_AGENT_ENABLED:-false}
  MSAP_DYNAMIC_HOST_AGENT_URL: ${MSAP_DYNAMIC_HOST_AGENT_URL:-http://host.docker.internal:8765}
  MSAP_DYNAMIC_HOST_AGENT_TOKEN: ${MSAP_DYNAMIC_HOST_AGENT_TOKEN:-}
  MSAP_DYNAMIC_HOST_AGENT_TIMEOUT_SECONDS: ${MSAP_DYNAMIC_HOST_AGENT_TIMEOUT_SECONDS:-120}
  MSAP_DYNAMIC_ADB_SERIAL: ${MSAP_DYNAMIC_ADB_SERIAL:-emulator-5554}
  MSAP_DYNAMIC_RUNNER_SYNC_DEMO_ENABLED: ${MSAP_DYNAMIC_RUNNER_SYNC_DEMO_ENABLED:-false}
  MSAP_DYNAMIC_LAB_PROXY_VALUE: ${MSAP_DYNAMIC_LAB_PROXY_VALUE:-10.0.2.2:18080}
  MSAP_DYNAMIC_INSTRUMENTED_SNAPSHOT_NAME: ${MSAP_DYNAMIC_INSTRUMENTED_SNAPSHOT_NAME:-msap-instrumented-base}
  MSAP_AGENT_CONTAINER_ENABLED: ${MSAP_AGENT_CONTAINER_ENABLED:-false}
  MSAP_AGENT_CONTAINER_IMAGE: ${MSAP_AGENT_CONTAINER_IMAGE:-msap-agent-runtime:local}
  MSAP_AGENT_CONTAINER_NETWORK: ${MSAP_AGENT_CONTAINER_NETWORK:-}
  MSAP_AGENT_GATEWAY_URL: ${MSAP_AGENT_GATEWAY_URL:-http://host.docker.internal:8000}
  MSAP_AGENT_RUN_TOKEN_TTL_SECONDS: ${MSAP_AGENT_RUN_TOKEN_TTL_SECONDS:-300}
  MSAP_AGENT_CONTAINER_TIMEOUT_SECONDS: ${MSAP_AGENT_CONTAINER_TIMEOUT_SECONDS:-120}
  MSAP_ASSESSMENT_PLANNER_PROVIDER: ${MSAP_ASSESSMENT_PLANNER_PROVIDER:-DETERMINISTIC}
  MSAP_ASSESSMENT_PLANNER_MODEL: ${MSAP_ASSESSMENT_PLANNER_MODEL:-gpt-5.6-luna}
  MSAP_OPENAI_API_KEY: ${MSAP_OPENAI_API_KEY:-}
  MSAP_ASSESSMENT_PLANNER_TIMEOUT_SECONDS: ${MSAP_ASSESSMENT_PLANNER_TIMEOUT_SECONDS:-60}
  MSAP_ASSESSMENT_PLANNER_MAX_RETRIES: ${MSAP_ASSESSMENT_PLANNER_MAX_RETRIES:-1}
  MSAP_ASSESSMENT_PLANNER_RETRY_BASE_MILLISECONDS: ${MSAP_ASSESSMENT_PLANNER_RETRY_BASE_MILLISECONDS:-250}
  MSAP_ASSESSMENT_PLANNER_MAX_OUTPUT_TOKENS: ${MSAP_ASSESSMENT_PLANNER_MAX_OUTPUT_TOKENS:-3000}
  MSAP_ASSESSMENT_PLANNER_REASONING_EFFORT: ${MSAP_ASSESSMENT_PLANNER_REASONING_EFFORT:-low}
  MSAP_AGENT_DECISION_MODEL: ${MSAP_AGENT_DECISION_MODEL:-gpt-5.6-luna}
  MSAP_AGENT_DECISION_REASONING_EFFORT: ${MSAP_AGENT_DECISION_REASONING_EFFORT:-low}
  MSAP_AGENT_DECISION_MAX_OUTPUT_TOKENS: ${MSAP_AGENT_DECISION_MAX_OUTPUT_TOKENS:-1800}
  MSAP_ASSESSMENT_EXECUTION_TOTAL_TIMEOUT_SECONDS: ${MSAP_ASSESSMENT_EXECUTION_TOTAL_TIMEOUT_SECONDS:-600}
  MSAP_ASSESSMENT_EXECUTION_MAX_RETRIES: ${MSAP_ASSESSMENT_EXECUTION_MAX_RETRIES:-1}
  MSAP_ASSESSMENT_EXECUTION_MAX_TOOL_CALLS: ${MSAP_ASSESSMENT_EXECUTION_MAX_TOOL_CALLS:-96}
  MSAP_ASSESSMENT_EXECUTION_MAX_OBSERVATION_BYTES: ${MSAP_ASSESSMENT_EXECUTION_MAX_OBSERVATION_BYTES:-65536}
  MSAP_ASSESSMENT_EXECUTION_MAX_ARTIFACTS: ${MSAP_ASSESSMENT_EXECUTION_MAX_ARTIFACTS:-100}
  MSAP_ASSESSMENT_EXECUTION_MAX_ARTIFACT_BYTES: ${MSAP_ASSESSMENT_EXECUTION_MAX_ARTIFACT_BYTES:-25165824}
  MSAP_ENVIRONMENT: development
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-msap}
  POSTGRES_USER: ${POSTGRES_USER:-msap_app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-msap-dev-password}
  POSTGRES_SSLMODE: disable
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "false"
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-msap-dev}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-msap-dev-password}
  MINIO_SECURE: "false"
  MINIO_BUCKET_APK_UPLOADS: ${MINIO_BUCKET_APK_UPLOADS:-msap-apk-uploads}
  MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-msap-artifacts}
  MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE:-msap-evidence}
  MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-msap-reports}
  MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-msap-exports}
  MSAP_VERIFY_UPLOAD_WITH_HEAD: "true"
  MSAP_MAX_APK_UNCOMPRESSED_BYTES: ${MSAP_MAX_APK_UNCOMPRESSED_BYTES:-1073741824}
  MSAP_MAX_APK_ENTRY_BYTES: ${MSAP_MAX_APK_ENTRY_BYTES:-268435456}
  MSAP_MAX_APK_COMPRESSION_RATIO: ${MSAP_MAX_APK_COMPRESSION_RATIO:-200}
  MSAP_MAX_DEX_BYTES: ${MSAP_MAX_DEX_BYTES:-268435456}
  MSAP_MAX_NORMALIZED_MATCHES: ${MSAP_MAX_NORMALIZED_MATCHES:-500}
  MSAP_SOURCE_INDEX_ENABLED: ${MSAP_SOURCE_INDEX_ENABLED:-true}
  MSAP_JADX_ENABLED: ${MSAP_JADX_ENABLED:-false}
  MSAP_SOURCE_INDEX_TIMEOUT_SECONDS: ${MSAP_SOURCE_INDEX_TIMEOUT_SECONDS:-300}
  MSAP_SOURCE_INDEX_MAX_DOCUMENTS: ${MSAP_SOURCE_INDEX_MAX_DOCUMENTS:-5000}
  MSAP_SOURCE_INDEX_MAX_DOCUMENT_BYTES: ${MSAP_SOURCE_INDEX_MAX_DOCUMENT_BYTES:-2097152}
  MSAP_SOURCE_INDEX_MAX_TOTAL_BYTES: ${MSAP_SOURCE_INDEX_MAX_TOTAL_BYTES:-104857600}
  MSAP_SOURCE_LINE_RANGE_LIMIT: ${MSAP_SOURCE_LINE_RANGE_LIMIT:-200}
  MSAP_UPLOAD_REQUIRE_SHA256: "true"
  ANALYZER_RULES_PATH: /app/rules
  MSAP_VALIDATE_RULES_ON_STARTUP: ${MSAP_VALIDATE_RULES_ON_STARTUP:-true}
  MSAP_REPORT_AUTHOR: ${MSAP_REPORT_AUTHOR:-MSAP Analyst}
  MSAP_REPORT_ORGANIZATION: ${MSAP_REPORT_ORGANIZATION:-MSAP}
  MSAP_REPORT_CLASSIFICATION: ${MSAP_REPORT_CLASSIFICATION:-Security Assessment Report}
  MSAP_REPORT_VERSION: ${MSAP_REPORT_VERSION:-1.0}

services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-msap}
      POSTGRES_USER: ${POSTGRES_USER:-msap_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-msap-dev-password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7.4.9-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-msap-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-msap-dev-password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # The bundled client probes MinIO's readiness endpoint.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/opt/msap/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-msap-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-msap-dev-password}
      MINIO_BUCKET_APK_UPLOADS: ${MINIO_BUCKET_APK_UPLOADS:-msap-apk-uploads}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-msap-artifacts}
      MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE:-msap-evidence}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-msap-reports}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-msap-exports}
    volumes:
      - ./docker/minio/init.sh:/opt/msap/init.sh:ro
      - ./docker/minio/cors.xml:/opt/msap/cors.xml:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  backend:
    image: msap-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./rules:/app/rules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    image: msap-backend:dev
    command: ["celery", "-A", "msap", "worker", "-l", "info"]
    environment: *backend-environment
    volumes:
      - ./backend:/app/backend
      - ./rules:/app/rules:ro
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  # Build target for the per-run sandbox image. The profile keeps it out of
  # normal `docker compose up`; Django launches an ephemeral container per run.
  agent-runtime:
    image: ${MSAP_AGENT_CONTAINER_IMAGE:-msap-agent-runtime:local}
    build:
      context: agent_runtime
      dockerfile: Dockerfile
    profiles: ["agent-runtime-build"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
