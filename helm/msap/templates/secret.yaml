{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "msap.secretName" . }}
  labels:
    {{- include "msap.labels" . | nindent 4 }}
  annotations:
    msap.io/development-defaults: "replace-before-production"
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ required "secrets.djangoSecretKey is required" .Values.secrets.djangoSecretKey | quote }}
  POSTGRES_USER: {{ required "secrets.postgresqlUsername is required" .Values.secrets.postgresqlUsername | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresqlPassword is required" .Values.secrets.postgresqlPassword | quote }}
  MINIO_ACCESS_KEY: {{ required "secrets.minioAccessKey is required" .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.minioSecretKey is required" .Values.secrets.minioSecretKey | quote }}
  {{- if not .Values.redis.enabled }}
  CELERY_BROKER_URL: {{ include "msap.redisBrokerUrl" . | quote }}
  CELERY_RESULT_BACKEND: {{ include "msap.redisResultBackend" . | quote }}
  {{- end }}
  {{- if not .Values.postgresql.enabled }}
  DATABASE_URL: {{ required "postgresql.externalDatabaseUrl is required when postgresql.enabled=false" .Values.postgresql.externalDatabaseUrl | quote }}
  {{- end }}
{{- end }}
