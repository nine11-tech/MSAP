{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "msap.componentName" (dict "root" . "component" "minio") }}
  labels:
    {{- include "msap.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    {{- include "msap.selectorLabels" (dict "root" . "component" "minio") | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.minio.apiPort }}
      targetPort: api
    - name: console
      port: {{ .Values.minio.consolePort }}
      targetPort: console
{{- end }}
