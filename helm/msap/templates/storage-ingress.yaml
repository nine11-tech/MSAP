{{- if and .Values.ingress.storage.enabled .Values.minio.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "msap.componentName" (dict "root" . "component" "storage") }}
  labels:
    {{- include "msap.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
  {{- with .Values.ingress.storage.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.storage.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.storage.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.storage.host is required when storage ingress is enabled" .Values.ingress.storage.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "msap.componentName" (dict "root" . "component" "minio") }}
                port:
                  name: api
{{- end }}
